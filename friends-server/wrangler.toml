# Cloudflare Worker config for the friends server. Deployed by
# .github/workflows/deploy-friends-server.yml, which fills in the D1 database id.
name = "habit-checker-friends"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "habit-checker-friends"
database_id = "D1_DATABASE_ID"

[vars]
# Profiles that may read the feedback inbox in the app, by name: "adj.animal.num" with the
# positions in src/names.js (num 0 = no number), comma-separated. Names are unique, so only
# the holder of that profile's recovery code signs in as it. If an admin deletes their
# profile, take the name out here, or whoever gets the name next would see the inbox.
ADMINS = "35.23.0"  # Rosy Alpaca

# The push server (server/), which sends admins a notification for new feedback.
[[services]]
binding = "PUSH"
service = "habit-checker-push"
