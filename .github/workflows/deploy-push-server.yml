# Deploys the push server (server/) to Cloudflare Workers.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN, created in Cloudflare
# from the "Edit Cloudflare Workers" token template. Everything else is set up here on
# the first run: the KV namespace, the workers.dev subdomain if the account has none,
# and the VAPID key pair (kept as a Worker secret and never printed).
# Without the secret this workflow skips itself instead of failing.
name: Deploy push server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/dates.js'
      - 'src/habits.js'
      - '.github/workflows/deploy-push-server.yml'
  workflow_dispatch:

concurrency: deploy-push-server

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKER: habit-checker-push
  KV_TITLE: habit-checker-push-subs
  API: https://api.cloudflare.com/client/v4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so the push server was not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Run tests
        if: steps.token.outputs.ready == 'true'
        run: npm test

      - name: Find account, KV namespace and workers.dev subdomain
        if: steps.token.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cf() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }

          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$ACCOUNT_ID" ]; then
            ACCOUNT_ID=$(cf "$API/accounts" | jq -r '.result[0].id // empty')
          fi
          [ -n "$ACCOUNT_ID" ] || { echo "::error::The token can't see any Cloudflare account. Create it from the 'Edit Cloudflare Workers' template."; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          KV_ID=$(cf "$API/accounts/$ACCOUNT_ID/storage/kv/namespaces?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id')
          if [ -z "$KV_ID" ]; then
            KV_ID=$(cf -X POST "$API/accounts/$ACCOUNT_ID/storage/kv/namespaces" -d "{\"title\":\"$KV_TITLE\"}" | jq -r '.result.id')
            echo "Created KV namespace $KV_TITLE"
          fi
          sed -i "s/KV_NAMESPACE_ID/$KV_ID/" server/wrangler.toml

          SUBDOMAIN=$(cf "$API/accounts/$ACCOUNT_ID/workers/subdomain" 2>/dev/null | jq -r '.result.subdomain // empty' || true)
          if [ -z "$SUBDOMAIN" ]; then
            SUBDOMAIN="habits-${ACCOUNT_ID:0:8}"
            cf -X PUT "$API/accounts/$ACCOUNT_ID/workers/subdomain" -d "{\"subdomain\":\"$SUBDOMAIN\"}" > /dev/null \
              || { echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once, then re-run."; exit 1; }
            echo "Registered workers.dev subdomain $SUBDOMAIN"
          fi
          echo "SUBDOMAIN=$SUBDOMAIN" >> "$GITHUB_ENV"

      - name: Deploy
        if: steps.token.outputs.ready == 'true'
        working-directory: server
        run: npx --yes wrangler@4 deploy

      - name: Create VAPID keys (first deploy only)
        if: steps.token.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cf() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          SECRETS="$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/secrets"
          if cf "$SECRETS" | jq -e '.result[] | select(.name == "VAPID_JWK")' > /dev/null; then
            echo "VAPID keys already exist, keeping them."
          else
            # Generated and uploaded in one pipe, so the private key is never printed or stored here.
            node --input-type=module -e "
              import { generateVapidJwk } from './server/src/webpush.js';
              const jwk = await generateVapidJwk();
              process.stdout.write(JSON.stringify({ name: 'VAPID_JWK', type: 'secret_text', text: JSON.stringify(jwk) }));
            " | cf -X PUT "$SECRETS" --data-binary @- > /dev/null
            echo "Created VAPID keys."
          fi

      - name: Check the server and print its address
        if: steps.token.outputs.ready == 'true'
        run: |
          URL="https://$WORKER.$SUBDOMAIN.workers.dev"
          # A brand-new workers.dev subdomain can take a few minutes to start answering.
          for i in $(seq 1 12); do
            curl -fsS "$URL/vapid-public-key" > /dev/null && break
            sleep 10
          done
          curl -fsS "$URL/vapid-public-key" || echo "::warning::$URL isn't answering yet. New workers.dev addresses can take a few minutes."
          echo "### Push server deployed at $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Put this address in src/config.js as PUSH_SERVER." >> "$GITHUB_STEP_SUMMARY"
